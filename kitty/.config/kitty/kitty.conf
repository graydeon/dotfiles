# ============================================================
# Enterprise Workstation Terminal
# ============================================================

font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 10.5

window_padding_width 5
background_opacity 1.0
dynamic_background_opacity no

# Dark corporate blue-gray terminal
background #111a22
foreground #d8dee4

cursor #d8dee4
cursor_text_color #111a22

selection_background #3a6ea5
selection_foreground #ffffff

# Classic ANSI palette, slightly subdued
color0  #101820
color1  #a84a4a
color2  #5f8f62
color3  #b59752
color4  #4e78a6
color5  #82689b
color6  #4f8a8b
color7  #c4cbd1

color8  #66717a
color9  #c56161
color10 #79a87b
color11 #ceb36b
color12 #7198c2
color13 #9c82b3
color14 #70a6a7
color15 #eef2f4

# Tabs
tab_bar_style separator
tab_bar_edge top

active_tab_foreground #ffffff
active_tab_background #315f8a
active_tab_font_style bold

inactive_tab_foreground #17212a
inactive_tab_background #c1c8ce
inactive_tab_font_style normal

tab_bar_background #9ca6ae

# Don't add extra visual effects
confirm_os_window_close 0
enable_audio_bell no
